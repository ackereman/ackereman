<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" style="font-family: Arial, sans-serif;">
  <!-- Title -->
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">图4: 评估与外推策略对比</text>
  
  <!-- Left side: Random Split -->
  <g id="random-split">
    <text x="225" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#2196f3">策略A: 随机拆分验证</text>
    
    <!-- Area representation -->
    <rect x="75" y="80" width="300" height="180" rx="8" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
    <text x="225" y="100" text-anchor="middle" font-size="11" fill="#1565c0">研究区域 (整体)</text>
    
    <!-- Training and test samples scattered -->
    <circle cx="120" cy="130" r="6" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
    <circle cx="180" cy="140" r="6" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <circle cx="250" cy="125" r="6" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
    <circle cx="310" cy="145" r="6" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
    <circle cx="150" cy="170" r="6" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <circle cx="280" cy="175" r="6" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
    <circle cx="200" cy="190" r="6" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <circle cx="330" cy="200" r="6" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <circle cx="140" cy="220" r="6" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
    <circle cx="270" cy="230" r="6" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <circle cx="190" cy="240" r="6" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
    <circle cx="310" cy="235" r="6" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
    
    <!-- Legend -->
    <g id="legend-random">
      <circle cx="100" cy="275" r="5" fill="#4caf50" stroke="#2e7d32" stroke-width="1.5"/>
      <text x="115" y="280" font-size="10" fill="#333">训练样本</text>
      <circle cx="200" cy="275" r="5" fill="#f44336" stroke="#c62828" stroke-width="1.5"/>
      <text x="215" y="280" font-size="10" fill="#333">测试样本</text>
    </g>
    
    <!-- Characteristics -->
    <rect x="75" y="300" width="300" height="100" rx="6" fill="#fff" stroke="#2196f3" stroke-width="1.5"/>
    <text x="225" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">特点</text>
    <text x="225" y="340" text-anchor="middle" font-size="10" fill="#333">✓ 样本空间分布相似</text>
    <text x="225" y="358" text-anchor="middle" font-size="10" fill="#333">✓ 指标偏乐观 (AUC高)</text>
    <text x="225" y="376" text-anchor="middle" font-size="10" fill="#d32f2f">✗ 存在空间泄漏</text>
    <text x="225" y="394" text-anchor="middle" font-size="10" fill="#d32f2f">✗ 外推能力评估不足</text>
  </g>
  
  <!-- Right side: Leave-One-Area-Out -->
  <g id="leave-area-out">
    <text x="675" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#9c27b0">策略B: 留区验证 (Leave-One-Area-Out)</text>
    
    <!-- Area A (training) -->
    <rect x="525" y="80" width="130" height="80" rx="6" fill="#c8e6c9" stroke="#4caf50" stroke-width="2"/>
    <text x="590" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">区域 A</text>
    <text x="590" y="118" text-anchor="middle" font-size="9" fill="#333">(训练)</text>
    <circle cx="560" cy="135" r="4" fill="#4caf50" stroke="#2e7d32" stroke-width="1.5"/>
    <circle cx="590" cy="140" r="4" fill="#4caf50" stroke="#2e7d32" stroke-width="1.5"/>
    <circle cx="620" cy="138" r="4" fill="#4caf50" stroke="#2e7d32" stroke-width="1.5"/>
    
    <!-- Area B (training) -->
    <rect x="670" y="80" width="130" height="80" rx="6" fill="#c8e6c9" stroke="#4caf50" stroke-width="2"/>
    <text x="735" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">区域 B</text>
    <text x="735" y="118" text-anchor="middle" font-size="9" fill="#333">(训练)</text>
    <circle cx="705" cy="135" r="4" fill="#4caf50" stroke="#2e7d32" stroke-width="1.5"/>
    <circle cx="735" cy="140" r="4" fill="#4caf50" stroke="#2e7d32" stroke-width="1.5"/>
    <circle cx="765" cy="138" r="4" fill="#4caf50" stroke="#2e7d32" stroke-width="1.5"/>
    
    <!-- Area C (test) -->
    <rect x="525" y="175" width="130" height="85" rx="6" fill="#ffcdd2" stroke="#f44336" stroke-width="2"/>
    <text x="590" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">区域 C</text>
    <text x="590" y="213" text-anchor="middle" font-size="9" fill="#333">(测试/外推)</text>
    <circle cx="560" cy="232" r="4" fill="#f44336" stroke="#c62828" stroke-width="1.5"/>
    <circle cx="590" cy="237" r="4" fill="#f44336" stroke="#c62828" stroke-width="1.5"/>
    <circle cx="620" cy="235" r="4" fill="#f44336" stroke="#c62828" stroke-width="1.5"/>
    
    <!-- Area D (training) -->
    <rect x="670" y="175" width="130" height="85" rx="6" fill="#c8e6c9" stroke="#4caf50" stroke-width="2"/>
    <text x="735" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">区域 D</text>
    <text x="735" y="213" text-anchor="middle" font-size="9" fill="#333">(训练)</text>
    <circle cx="705" cy="232" r="4" fill="#4caf50" stroke="#2e7d32" stroke-width="1.5"/>
    <circle cx="735" cy="237" r="4" fill="#4caf50" stroke="#2e7d32" stroke-width="1.5"/>
    <circle cx="765" cy="235" r="4" fill="#4caf50" stroke="#2e7d32" stroke-width="1.5"/>
    
    <text x="675" y="285" text-anchor="middle" font-size="9" fill="#666" style="font-style: italic;">不同成矿带/矿集区空间独立</text>
    
    <!-- Characteristics -->
    <rect x="525" y="300" width="300" height="100" rx="6" fill="#fff" stroke="#9c27b0" stroke-width="1.5"/>
    <text x="675" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#7b1fa2">特点</text>
    <text x="675" y="340" text-anchor="middle" font-size="10" fill="#333">✓ 真实外推能力评估</text>
    <text x="675" y="358" text-anchor="middle" font-size="10" fill="#333">✓ 避免空间自相关泄漏</text>
    <text x="675" y="376" text-anchor="middle" font-size="10" fill="#1976d2">✓ 指标更保守但可信</text>
    <text x="675" y="394" text-anchor="middle" font-size="10" fill="#1976d2">✓ 适合跨区迁移验证</text>
  </g>
  
  <!-- Comparison metrics -->
  <g id="metrics">
    <rect x="75" y="425" width="750" height="105" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/>
    <text x="450" y="448" text-anchor="middle" font-size="13" font-weight="bold" fill="#f57f17">性能指标对比</text>
    
    <!-- Metric bars -->
    <text x="150" y="470" font-size="10" fill="#333">AUC:</text>
    <rect x="200" y="460" width="200" height="15" rx="3" fill="#c8e6c9" stroke="#4caf50" stroke-width="1"/>
    <text x="410" y="472" font-size="10" fill="#2e7d32">策略A: 0.92</text>
    <rect x="480" y="460" width="150" height="15" rx="3" fill="#ffcdd2" stroke="#f44336" stroke-width="1"/>
    <text x="640" y="472" font-size="10" fill="#c62828">策略B: 0.85</text>
    
    <text x="110" y="495" font-size="10" fill="#333">精确率@10%:</text>
    <rect x="200" y="485" width="190" height="15" rx="3" fill="#c8e6c9" stroke="#4caf50" stroke-width="1"/>
    <text x="400" y="497" font-size="10" fill="#2e7d32">策略A: 0.78</text>
    <rect x="480" y="485" width="135" height="15" rx="3" fill="#ffcdd2" stroke="#f44336" stroke-width="1"/>
    <text x="625" y="497" font-size="10" fill="#c62828">策略B: 0.68</text>
    
    <text x="100" y="520" font-size="10" fill="#333">外推一致性:</text>
    <rect x="200" y="510" width="100" height="15" rx="3" fill="#ffcdd2" stroke="#f44336" stroke-width="1"/>
    <text x="310" y="522" font-size="10" fill="#c62828">策略A: 低</text>
    <rect x="480" y="510" width="160" height="15" rx="3" fill="#c8e6c9" stroke="#4caf50" stroke-width="1"/>
    <text x="650" y="522" font-size="10" fill="#2e7d32">策略B: 高</text>
  </g>
  
  <!-- Recommendation -->
  <rect x="75" y="540" width="750" height="20" rx="5" fill="#e1f5fe" stroke="#0288d1" stroke-width="1.5"/>
  <text x="450" y="555" text-anchor="middle" font-size="11" font-weight="bold" fill="#01579b">建议: 工程部署前采用策略B验证，确保跨区泛化能力</text>
  
  <!-- VS indicator -->
  <circle cx="450" cy="200" r="35" fill="#fff" stroke="#666" stroke-width="3"/>
  <text x="450" y="210" text-anchor="middle" font-size="20" font-weight="bold" fill="#666">VS</text>
</svg>
