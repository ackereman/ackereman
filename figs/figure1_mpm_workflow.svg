<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="font-family: Arial, sans-serif;">
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">图1: 矿产远景评价工作流程</text>
  
  <!-- Multi-source Data Input -->
  <g id="input-data">
    <rect x="50" y="60" width="150" height="280" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
    <text x="125" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">多源数据</text>
    
    <!-- Data types -->
    <rect x="65" y="100" width="120" height="35" rx="4" fill="#fff" stroke="#4caf50" stroke-width="1"/>
    <text x="125" y="122" text-anchor="middle" font-size="11" fill="#333">地质图</text>
    
    <rect x="65" y="145" width="120" height="35" rx="4" fill="#fff" stroke="#4caf50" stroke-width="1"/>
    <text x="125" y="167" text-anchor="middle" font-size="11" fill="#333">地球物理</text>
    
    <rect x="65" y="190" width="120" height="35" rx="4" fill="#fff" stroke="#4caf50" stroke-width="1"/>
    <text x="125" y="212" text-anchor="middle" font-size="11" fill="#333">地球化学</text>
    
    <rect x="65" y="235" width="120" height="35" rx="4" fill="#fff" stroke="#4caf50" stroke-width="1"/>
    <text x="125" y="257" text-anchor="middle" font-size="11" fill="#333">遥感数据</text>
    
    <rect x="65" y="280" width="120" height="35" rx="4" fill="#fff" stroke="#4caf50" stroke-width="1"/>
    <text x="125" y="302" text-anchor="middle" font-size="11" fill="#333">构造数据</text>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M 200 200 L 240 200" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Preprocessing -->
  <g id="preprocessing">
    <rect x="240" y="150" width="120" height="100" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
    <text x="300" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">预处理</text>
    
    <text x="300" y="195" text-anchor="middle" font-size="10" fill="#555">数据清洗</text>
    <text x="300" y="210" text-anchor="middle" font-size="10" fill="#555">标准化</text>
    <text x="300" y="225" text-anchor="middle" font-size="10" fill="#555">特征提取</text>
    <text x="300" y="240" text-anchor="middle" font-size="10" fill="#555">空间配准</text>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M 360 200 L 400 200" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Modeling -->
  <g id="modeling">
    <rect x="400" y="120" width="120" height="160" rx="8" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
    <text x="460" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">建模</text>
    
    <rect x="415" y="155" width="90" height="30" rx="4" fill="#fff" stroke="#2196f3" stroke-width="1"/>
    <text x="460" y="175" text-anchor="middle" font-size="10" fill="#333">SVM/RF</text>
    
    <rect x="415" y="195" width="90" height="30" rx="4" fill="#fff" stroke="#2196f3" stroke-width="1"/>
    <text x="460" y="215" text-anchor="middle" font-size="10" fill="#333">XGBoost</text>
    
    <rect x="415" y="235" width="90" height="30" rx="4" fill="#fff" stroke="#2196f3" stroke-width="1"/>
    <text x="460" y="255" text-anchor="middle" font-size="10" fill="#333">CNN/Transformer</text>
  </g>
  
  <!-- Arrow 3 -->
  <path d="M 520 200 L 560 200" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Evaluation -->
  <g id="evaluation">
    <rect x="560" y="150" width="120" height="100" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
    <text x="620" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">评估</text>
    
    <text x="620" y="195" text-anchor="middle" font-size="10" fill="#555">AUC/PR曲线</text>
    <text x="620" y="210" text-anchor="middle" font-size="10" fill="#555">留区验证</text>
    <text x="620" y="225" text-anchor="middle" font-size="10" fill="#555">不确定性</text>
    <text x="620" y="240" text-anchor="middle" font-size="10" fill="#555">空间一致性</text>
  </g>
  
  <!-- Arrow 4 -->
  <path d="M 620 250 L 620 310" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Output -->
  <g id="output">
    <rect x="560" y="310" width="120" height="60" rx="8" fill="#ffebee" stroke="#f44336" stroke-width="2"/>
    <text x="620" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">产出</text>
    
    <text x="620" y="350" text-anchor="middle" font-size="10" fill="#555">远景图</text>
    <text x="620" y="365" text-anchor="middle" font-size="10" fill="#555">靶区排序</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>
</svg>
